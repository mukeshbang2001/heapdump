    - step: &default-integration-test
        <<: *backend-step-defaults
        name: Default Integration Tests 🧽
        services:
          - docker-with-more-memory
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - |
            # Ryuk (cleanup sidecar) needs to be turned off since Bitbucket Pipelines does not allow starting privileged containers
            # see https://www.testcontainers.org/supported_docker_environment/continuous_integration/bitbucket_pipelines/
            export TESTCONTAINERS_RYUK_DISABLED=true
          - ./scripts/bitbucketIntegrationTest.sh
        artifacts:
          - jira-migration-plugin/target/failsafe-reports/**
    - step: &integration-test-group-0
        <<: *backend-step-defaults
        name: Integration Tests 🧽 (Group 0)
        services:
          - docker-with-more-memory
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - |
            # Ryuk (cleanup sidecar) needs to be turned off since Bitbucket Pipelines does not allow starting privileged containers
            # see https://www.testcontainers.org/supported_docker_environment/continuous_integration/bitbucket_pipelines/
            export TESTCONTAINERS_RYUK_DISABLED=true
          - ./scripts/bitbucketIntegrationTestOnly.sh -Dintegration-test.databases.skip=true -Djacoco.destFile='${project.build.directory}/jacoco-IT-group-0.exec'
        artifacts:
          - jira-migration-plugin/target/failsafe-reports/**
          - jira-migration-plugin/target/jacoco*.exec
