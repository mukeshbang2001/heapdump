image:
  ## See README
  name: docker-proxy.services.atlassian.com/atlassian/jira-migration-plugin:cf4f462c14
  username: dalmeida
  password: $PIPELINES_JWT_TOKEN

options:
  docker: true
  size: 4x

stepDefaults: &stepDefaults
  caches:
    - maven
    - node
    - docker
    - cypress

definitions:
  caches:
    yarn: $HOME/.cache
    cypress: $HOME/.cache/Cypress
    target: jira-migration-plugin/target
    maven:
      key:
        files:
          - "**/pom.xml"
      path: ~/.m2/repository

  scripts:
    playwright-debug-on-failure: &playwright-debug-on-failure
      - |
        if [ "$BITBUCKET_EXIT_CODE" -ne 0 ]; then
          echo "Tests failed! For debugging, see: https://hello.atlassian.net/wiki/x/hdAYkQE"
        fi
    setup-deps: &setup-deps |
      if ! command -v jq &> /dev/null; then
        apt-get update && apt-get install -y jq
      fi
      if [ -n "${BITBUCKET_STEP_TRIGGERER_UUID:-}" ]; then
        export TRIGGEREDBY=$(curl -s -X GET -g "https://api.bitbucket.org/2.0/users/${BITBUCKET_STEP_TRIGGERER_UUID}" 2>/dev/null | jq -r '.display_name // "Unknown Triggerer"' || echo "Unknown Triggerer")
      else
        export TRIGGEREDBY="Unknown Triggerer"
      fi
  services:
    docker:
      memory: 2048
    docker-with-more-memory:
      memory: 4096
      type: docker
    mysql:
      image:
        name: docker-proxy.services.atlassian.com/atlassian/jira/server/mysql:5.7
        username: buildeng
        password: $PIPELINES_JWT_TOKEN
      memory: 2048
    mysql8:
      image:
        name: docker-proxy.services.atlassian.com/atlassian/jira/server/mysql:8
        username: buildeng
        password: $PIPELINES_JWT_TOKEN
      memory: 2048
    mysql84:
      image:
        name: docker-proxy.services.atlassian.com/atlassian/jira/server/mysql:8.4
        username: buildeng
        password: $PIPELINES_JWT_TOKEN
      memory: 2048
    mysqlutf8mb4:
      image:
        name: docker-proxy.services.atlassian.com/atlassian/jira/server/mysql-utf8mb4:5.7
        username: buildeng
        password: $PIPELINES_JWT_TOKEN
      memory: 2048
    mssql2017:
      image:
        name: docker-proxy.services.atlassian.com/atlassian/jira/server/mssql:2017
        username: buildeng
        password: $PIPELINES_JWT_TOKEN
      memory: 4096
    mssql2022:
      image:
        name: docker-proxy.services.atlassian.com/atlassian/jira/server/mssql:2022
        username: buildeng
        password: $PIPELINES_JWT_TOKEN
      memory: 4096
    postgres:
      image:
        name: docker-proxy.services.atlassian.com/atlassian/jira/server/postgres:9.4
        username: buildeng
        password: $PIPELINES_JWT_TOKEN
      memory: 2048
    postgres10:
      image: postgres:10
      variables:
        POSTGRES_USER: jira
        POSTGRES_PASSWORD: jira
        POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    postgres12:
      image: postgres:12
      variables:
        POSTGRES_USER: jira
        POSTGRES_PASSWORD: jira
        POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    postgres17:
      image: postgres:17
      variables:
        POSTGRES_USER: jira
        POSTGRES_PASSWORD: jira
        POSTGRES_INITDB_ARGS: '--encoding=UTF-8 --lc-collate=C --lc-ctype=C'
    statsd:
      image:
        name: docker-proxy.services.atlassian.com/sox/observability/statsd-docker:stable
        username: na # Can be anything
        password: $PIPELINES_JWT_TOKEN
      variables:
        STATSD_SERVICE_NAME: statsd-sidecar-jira-migration-plugin
        STATSD_BUSINESS_UNIT: Migration-Platform
        STATSD_HOSTNAME: global
        LOG_RAW_METRIC: "true"

  steps:
    - step: &backend-step-defaults
        caches:
          - maven
        condition:
          changesets:
            includePaths:
              - bitbucket-pipelines.yml
              - "**/pom.xml"
              - jira-migration-plugin/**
              - jira-migration-plugin-util/**
              - jira-migration-plugin-pre-platform7-compat/**
              - scripts/**
              - pom.xml
    ##
    ## Main build
    ##
    - step: &build-test
        <<: *backend-step-defaults
        name: Build 🔧 Test 🍏 (Backend)
        size: 8x
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./scripts/bitbucketBuild.sh
        artifacts:
          - jira-migration-plugin/target/surefire-reports/**
          - jira-migration-plugin/target/pacts/**
    - step: &run-static-analysis
        <<: *backend-step-defaults
        caches: []
        name: Run static analysis
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./scripts/bitbucketDetektScan.sh
    - step: &ktlint
        <<: *backend-step-defaults
        name: ktlint 👮
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./scripts/bitbucketKtlint.sh
    - step: &build-only
        <<: *backend-step-defaults
        name: Build 🔧 Package 📦 (Backend)
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./scripts/bitbucketBuildOnly.sh -Dkotlin.test.compile.skip=true
        artifacts:
          - jira-migration-plugin/target/jira-migration-plugin-*.jar
          - jira-migration-plugin/target/jira-migration-plugin-*.obr
          - "**/target/classes/**"
          - "**/target/kotlin-ic/**"
    - step: &resolve-dependencies
        <<: *backend-step-defaults
        name: Dependency resolution 📬 & Compile 🔨
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - export MAVEN_OPTS="-Xmx6000m -XX:+UseG1GC"
          - mvn --no-transfer-progress install -P production -DskipTests=true -Dfrontend.skip=true -DskipDetekt=true -Dkotlin.compiler.incremental=true -Dbuildtime.output.log=true
        artifacts:
          - "**/target/classes/**"
          - "**/target/test-classes/**"
          - "**/target/generated-sources/**"
          - "**/target/generated-test-sources/**"
          - "**/target/*.jar"
    ##
    ## Split unit test builds
    ##
    - step: &unit-test-group-0
        <<: *backend-step-defaults
        name: Unit Test 🍏 (group-0)
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./scripts/bitbucketUnitTestOnly.sh -Dsurefire.includesFile="$(pwd)/jira-migration-plugin/test/unit-test-group-0.txt" -Djacoco.destFile='${project.build.directory}/jacoco-group-0.exec'
        artifacts:
          - "**/target/surefire-reports/*"
          - "**/target/jacoco*.exec"
          - "**/target/test-classes/**"
    - step: &unit-test-group-1
        <<: *backend-step-defaults
        name: Unit Test 🍏 (group-1)
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./scripts/bitbucketUnitTestOnly.sh -Dsurefire.includesFile="$(pwd)/jira-migration-plugin/test/unit-test-group-1.txt" -Djacoco.destFile='${project.build.directory}/jacoco-group-1.exec'
        artifacts:
          - "**/target/surefire-reports/*"
          - "**/target/jacoco*.exec"
          - "**/target/test-classes/**"
    - step: &unit-test-group-2
        <<: *backend-step-defaults
        name: Unit Test 🍏 (group-2)
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./scripts/bitbucketUnitTestOnly.sh -Dsurefire.includesFile="$(pwd)/jira-migration-plugin/test/unit-test-group-2.txt" -Djacoco.destFile='${project.build.directory}/jacoco-group-2.exec'
        artifacts:
          - "**/target/surefire-reports/*"
          - "**/target/jacoco*.exec"
          - "**/target/test-classes/**"
    - step: &unit-test-group-3
        <<: *backend-step-defaults
        name: Unit Test 🍏 (group-3)
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./scripts/bitbucketUnitTestOnly.sh -Dsurefire.includesFile="$(pwd)/jira-migration-plugin/test/unit-test-group-3.txt" -Djacoco.destFile='${project.build.directory}/jacoco-group-3.exec'
        artifacts:
          - "**/target/surefire-reports/*"
          - "**/target/jacoco*.exec"
          - "**/target/test-classes/**"
    - step: &unit-test-group-other
        <<: *backend-step-defaults
        name: Unit Test 🍏 (group-other)
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./scripts/bitbucketUnitTestOnly.sh -Dsurefire.excludesFile="$(pwd)/jira-migration-plugin/test/unit-test-group-exclusions.txt" -Djacoco.destFile='${project.build.directory}/jacoco-group-other.exec'
        artifacts:
          - "**/target/surefire-reports/*"
          - "**/target/jacoco*.exec"
          - "**/target/test-classes/**"

    ##
    ## Sonar
    ##
    - step: &sonar
        <<: *backend-step-defaults
        name: Sonar 🎯
        size: 8x
        clone:
          strategy: clone
        services:
          - docker-with-more-memory
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - apt-get update
          - apt-get install -y jq
          - # Ryuk (cleanup sidecar) needs to be turned off since Bitbucket Pipelines does not allow starting privileged containers
            # see https://www.testcontainers.org/supported_docker_environment/continuous_integration/bitbucket_pipelines/
            export TESTCONTAINERS_RYUK_DISABLED=true
          - ./scripts/bitbucketSonar.sh
    - step: &sonar-report
        <<: *backend-step-defaults
        name: Sonar 🎯
        clone:
          strategy: clone
          depth: full
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - *setup-deps
          - ./scripts/bitbucketSonarReport.sh

    ##
    ## Plugin release:
    ##
    - step: &perform-release
        name: Create Release Version 🚢
        trigger: manual
        size: 8x
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - # Ryuk (cleanup sidecar) needs to be turned off since Bitbucket Pipelines does not allow starting privileged containers
            # see https://www.testcontainers.org/supported_docker_environment/continuous_integration/bitbucket_pipelines/
            export TESTCONTAINERS_RYUK_DISABLED=true
          - ./scripts/bitbucketRelease.sh
        artifacts:
          - jira-migration-plugin/target/jira-migration-plugin-*.jar
          - jira-migration-plugin/target/jira-migration-plugin-*.obr

    - step: &create-merge-back-PRs
        name: Merge back to Develop and Master
        size: 8x
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - apt-get update
          - apt-get install -y jq
          - # Ryuk (cleanup sidecar) needs to be turned off since Bitbucket Pipelines does not allow starting privileged containers
            # see https://www.testcontainers.org/supported_docker_environment/continuous_integration/bitbucket_pipelines/
            export TESTCONTAINERS_RYUK_DISABLED=true
          - ./scripts/bitbucketMergePR.sh
    ##
    ## Release plugin for particular customer
    ##
    - step: &perform-custom-release
        name: Create Custom Release Version
        trigger: manual
        size: 8x
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - apt-get update
          - apt-get install -y xmlstarlet
          - # Ryuk (cleanup sidecar) needs to be turned off since Bitbucket Pipelines does not allow starting privileged containers
            # see https://www.testcontainers.org/supported_docker_environment/continuous_integration/bitbucket_pipelines/
            export TESTCONTAINERS_RYUK_DISABLED=true
          - ./scripts/bitbucketCustomRelease.sh $CUSTOMER_NAME "$CUSTOM_RELEASE_REASON" "${BASE_VERSION:-}"
        artifacts:
          - jira-migration-plugin-*.jar
          - jira-migration-plugin-*.obr
    ##
    ## Publish plugin onto Public Maven Repo
    ##
    - step: &publish-custom-release-to-maven
        name: Publish Custom Release Version To Public Maven
        trigger: manual
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - apt-get update
          - apt-get install -y xmlstarlet
          - # Ryuk (cleanup sidecar) needs to be turned off since Bitbucket Pipelines does not allow starting privileged containers
            # see https://www.testcontainers.org/supported_docker_environment/continuous_integration/bitbucket_pipelines/
            export TESTCONTAINERS_RYUK_DISABLED=true
          - ./scripts/bitbucketPublishCustomRelease.sh $CUSTOMER_NAME "${BASE_VERSION:-}"
    ##
    ## Build the jar and install it to standing instances
    ## http://10.9.31.146:8080 instance is used for internal go/jcma-ui tool
    ##
    - step: &install-snapshot-jar-to-server-instance
        <<: *stepDefaults
        name: Build jar and install in internal server instances
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./scripts/buildSnapshotVersionWithHash.sh
          - ./scripts/installBuildJarToJiraInstance.sh http://10.9.31.146:8080
    - step: &install-snapshot-jar-to-server-instance-manual
        <<: *install-snapshot-jar-to-server-instance
        trigger: manual
    ##
    ## Unit Tests
    ##
    - step: &unit-tests
        <<: *backend-step-defaults
        name: Unit Tests 🍏
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./scripts/bitbucketUnitTest.sh -Djacoco.destFile='${project.build.directory}/jacoco-unit-tests.exec'
        artifacts:
          - "**/target/surefire-reports/*"
          - "**/target/jacoco*.exec"
          - "**/target/classes/**"
    ##
    ## 9 database integration builds (3 db vendors * 3 Jira versions):
    ##
    - step: &database-it-postgres-jira-85
        <<: *backend-step-defaults
        name: Postgres 🐘 Jira 8.5 IT
        services:
          - postgres
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./scripts/bitbucketDatabaseITOnly.sh postgresql 8.5 1.8
        artifacts:
          - jira-migration-plugin/target/group-jira-integration/tomcat85x/surefire-reports/*
          - jira-migration-plugin/target/single/home/log/*
    - step: &database-it-postgres-jira-820
        <<: *backend-step-defaults
        name: Postgres 🐘 Jira 8.20 IT
        services:
          - postgres10
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./scripts/bitbucketDatabaseITOnly.sh postgresql 8.20 1.8
        artifacts:
          - jira-migration-plugin/target/group-jira-integration/tomcat85x/surefire-reports/*
          - jira-migration-plugin/target/single/home/log/*
    - step: &database-it-postgres-jira-9.12.19
        <<: *backend-step-defaults
        name: Postgres 🐘 Jira 9.12.19 IT
        services:
          - postgres12
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./scripts/bitbucketDatabaseITOnly.sh postgresql 9.12.19 17
        artifacts:
          - jira-migration-plugin/target/group-jira-integration/tomcat85x/surefire-reports/*
          - jira-migration-plugin/target/single/home/log/*
    - step: &database-it-postgres-jira-10.4.1
        <<: *backend-step-defaults
        name: Postgres 🐘 Jira 10.4.1 IT
        services:
          - postgres12
          - statsd
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./scripts/bitbucketDatabaseITOnly.sh postgresql 10.4.1 17 -Dbitbucket.step.name='Postgres_Jira_10.4.1_IT' -Dbitbucket.branch=$BITBUCKET_BRANCH
        artifacts:
          - jira-migration-plugin/target/group-jira-integration/tomcat85x/surefire-reports/*
          - jira-migration-plugin/target/single/home/log/*
    - step: &database-it-postgres-jira-11.0.0
        <<: *backend-step-defaults
        name: Postgres 🐘 Jira 11.0.0 IT
        services:
          - postgres17
          - statsd
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./scripts/bitbucketDatabaseITOnly.sh postgresql 11.0.0 21 -Dbitbucket.step.name='Postgres_Jira_11.0.0_IT' -Dbitbucket.branch=$BITBUCKET_BRANCH
        artifacts:
          - jira-migration-plugin/target/group-jira-integration/tomcat85x/surefire-reports/*
          - jira-migration-plugin/target/single/home/log/*
    - step: &database-it-mysql-jira-85
        <<: *backend-step-defaults
        name: MySQL 🐬 Jira 8.5 IT
        services:
          - mysql
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./scripts/bitbucketDatabaseITOnly.sh mysql 8.5 1.8 -DmysqlDatabaseType=mysql
        artifacts:
          - jira-migration-plugin/target/group-jira-integration/tomcat85x/surefire-reports/*
          - jira-migration-plugin/target/single/home/log/*
    - step: &database-it-mysql-jira-820
        <<: *backend-step-defaults
        name: MySQL 🐬 Jira 8.20 IT
        services:
          - mysqlutf8mb4
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./scripts/bitbucketDatabaseITOnly.sh mysql 8.20 1.8 -DmysqlDatabaseType=mysql57
        artifacts:
          - jira-migration-plugin/target/group-jira-integration/tomcat85x/surefire-reports/*
          - jira-migration-plugin/target/single/home/log/*
    - step: &database-it-mysql-jira-9.12.19
        <<: *backend-step-defaults
        name: MySQL 🐬 Jira 9.12.19 IT
        services:
          - mysql8
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./scripts/bitbucketDatabaseITOnly.sh mysql 9.12.19 17 -DmysqlDatabaseType=mysql8
        artifacts:
          - jira-migration-plugin/target/group-jira-integration/tomcat85x/surefire-reports/*
          - jira-migration-plugin/target/single/home/log/*
    # Base step template for MySQL 8.0 (Jira 10.4.1) IT group steps
    - step: &mysql8-it-group-base
        <<: *backend-step-defaults
        services: [mysql8, statsd]
        artifacts: &mysql-it-artifacts
          - jira-migration-plugin/target/group-jira-integration/tomcat85x/surefire-reports/*
          - jira-migration-plugin/target/single/home/log/*
          - jira-migration-plugin/target/it-test-timings.csv
    # Base step template for MySQL 8.4 (Jira 11.0.0) IT group steps
    - step: &mysql84-it-group-base
        <<: *backend-step-defaults
        services: [mysql84, statsd]
        artifacts: *mysql-it-artifacts
    - step: &database-it-mysql-jira-10.4.1-group-0
        <<: *mysql8-it-group-base
        name: MySQL 🐬 Jira 10.4.1 IT — group-0 (configItems + versionSpecific + correction)
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./scripts/bitbucketDatabaseITOnly.sh mysql 10.4.1 17 -DmysqlDatabaseType=mysql8 "-Dit.tests.include=it/com/atlassian/jira/migration/PreMigrationReportsIntegrationTest.java,it/com/atlassian/jira/migration/PreMigrationReportsIntegrationVersionSpecificTest.java,it/com/atlassian/jira/migration/PostMigrationReportsIntegrationVersionSpecificTest.java,it/com/atlassian/jira/migration/AutomaticDataCorrectionIntegrationTest.java,it/com/atlassian/jira/migration/AdvancedRoadmapsIntegrationTest.java" -Dbitbucket.step.name='MySQL_Jira_10.4.1_IT_group0' -Dbitbucket.branch=$BITBUCKET_BRANCH
    - step: &database-it-mysql-jira-10.4.1-group-1
        <<: *mysql8-it-group-base
        name: MySQL 🐬 Jira 10.4.1 IT — group-1 (summary + postMigration)
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./scripts/bitbucketDatabaseITOnly.sh mysql 10.4.1 17 -DmysqlDatabaseType=mysql8 "-Dit.tests.include=it/com/atlassian/jira/migration/PreMigrationSummaryReportsIntegrationTest.java,it/com/atlassian/jira/migration/PostMigrationReportsIntegrationTest.java" -Dbitbucket.step.name='MySQL_Jira_10.4.1_IT_group1' -Dbitbucket.branch=$BITBUCKET_BRANCH
    - step: &database-it-mysql-jira-10.4.1-group-2
        <<: *mysql8-it-group-base
        name: MySQL 🐬 Jira 10.4.1 IT — group-2 (usersGroups + extraction + export)
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./scripts/bitbucketDatabaseITOnly.sh mysql 10.4.1 17 -DmysqlDatabaseType=mysql8 "-Dit.tests.include=it/com/atlassian/jira/migration/PreMigrationUsersGroupsReportsIntegrationTest.java,it/com/atlassian/jira/migration/ProjectExtractionIntegrationTest.java,it/com/atlassian/jira/migration/ProjectExportDataIntegrationTest.java" -Dbitbucket.step.name='MySQL_Jira_10.4.1_IT_group2' -Dbitbucket.branch=$BITBUCKET_BRANCH
    - step: &database-it-mysql-jira-11.0.0-group-0
        <<: *mysql84-it-group-base
        name: MySQL 🐬 Jira 11.0.0 IT — group-0 (configItems + versionSpecific + correction)
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./scripts/bitbucketDatabaseITOnly.sh mysql 11.0.0 21 -DmysqlDatabaseType=mysql8 "-Dit.tests.include=it/com/atlassian/jira/migration/PreMigrationReportsIntegrationTest.java,it/com/atlassian/jira/migration/PreMigrationReportsIntegrationVersionSpecificTest.java,it/com/atlassian/jira/migration/PostMigrationReportsIntegrationVersionSpecificTest.java,it/com/atlassian/jira/migration/AutomaticDataCorrectionIntegrationTest.java,it/com/atlassian/jira/migration/AdvancedRoadmapsIntegrationTest.java" -Dbitbucket.step.name='MySQL_Jira_11.0.0_IT_group0' -Dbitbucket.branch=$BITBUCKET_BRANCH
    - step: &database-it-mysql-jira-11.0.0-group-1
        <<: *mysql84-it-group-base
        name: MySQL 🐬 Jira 11.0.0 IT — group-1 (summary + postMigration)
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./scripts/bitbucketDatabaseITOnly.sh mysql 11.0.0 21 -DmysqlDatabaseType=mysql8 "-Dit.tests.include=it/com/atlassian/jira/migration/PreMigrationSummaryReportsIntegrationTest.java,it/com/atlassian/jira/migration/PostMigrationReportsIntegrationTest.java" -Dbitbucket.step.name='MySQL_Jira_11.0.0_IT_group1' -Dbitbucket.branch=$BITBUCKET_BRANCH
    - step: &database-it-mysql-jira-11.0.0-group-2
        <<: *mysql84-it-group-base
        name: MySQL 🐬 Jira 11.0.0 IT — group-2 (usersGroups + extraction + export)
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
