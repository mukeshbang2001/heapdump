    ##
    ## JFR Performance Test (capture + analyse + regression gate)
    ##
    - step: &jfr-perf-test
        name: JFR Performance Test 📊
        trigger: manual
        size: 2x
        script:
          - apt-get update -q && apt-get install -y -q jq openssh-client
          # Stage 1: capture JFR for user_migrate phase
          - bash perf_v2/01_capture.sh
              --host "${INSTENV_HOST}"
              --jira-user "${JIRA_ADMIN_USER:-admin}"
              --jira-pass "${JIRA_ADMIN_PASS}"
              --phase user_migrate
              --output-dir perf_output
          # Stage 1: capture JFR for project_export phase
          - bash perf_v2/01_capture.sh
              --host "${INSTENV_HOST}"
              --jira-user "${JIRA_ADMIN_USER:-admin}"
              --jira-pass "${JIRA_ADMIN_PASS}"
              --phase project_export
              --output-dir perf_output
          # Stage 2: extract events from both JFR files
          - python3 perf_v2/02_extract.py --jfr perf_output/user_migrate.jfr   --out perf_output --app-package com.atlassian
          - python3 perf_v2/02_extract.py --jfr perf_output/project_export.jfr --out perf_output --app-package com.atlassian
          # Stage 3: metrics + regression comparison vs committed baselines
          - |
            python3 perf_v2/03_metrics.py \
              --raw perf_output/user_migrate_raw.json \
              --out perf_output \
              --baseline perf_v2/baselines/user_migrate_baseline.json \
              --thresh-cpu 30 --thresh-heap 30 --thresh-gc-pause 50 --thresh-gc-full 0 \
              --thresh-db-reads 20 --thresh-db-latency 30 --thresh-api-latency 30 \
              --thresh-blocking 30 --thresh-threads 20 --thresh-exceptions 50 \
              --fail-on-regression
          - |
            python3 perf_v2/03_metrics.py \
              --raw perf_output/project_export_raw.json \
              --out perf_output \
              --baseline perf_v2/baselines/project_export_baseline.json \
              --thresh-cpu 30 --thresh-heap 30 --thresh-gc-pause 50 --thresh-gc-full 0 \
              --thresh-db-reads 20 --thresh-db-latency 30 --thresh-api-latency 30 \
              --thresh-blocking 30 --thresh-threads 20 --thresh-exceptions 50 \
              --fail-on-regression
          # Stage 4: generate HTML reports (doesn't affect exit code)
          - python3 perf_v2/04_html.py --raw perf_output/user_migrate_raw.json   --out perf_output --baseline perf_v2/baselines/user_migrate_baseline.json   || true
          - python3 perf_v2/04_html.py --raw perf_output/project_export_raw.json --out perf_output --baseline perf_v2/baselines/project_export_baseline.json || true
        artifacts:
          - perf_output/**

    - step: &trigger-perf-test-if-branch-diverges-from-master-or-develop
        name: Trigger Perf Test if branch diverges from Master/Develop
        trigger: manual
        script:
          - scripts/performance-testing/detectDivergenceFromAncestorBranch.sh
          # If we get here, divergence was detected, so run perf test
          - *setup-deps
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - scripts/buildSnapshotVersionWithHash.sh
          - scripts/performance-testing/triggerPerfTestForBuildJar.sh staging DEBUG -a "${TRIGGEREDBY}"

    - step: &notify-jira-for-custom-jar
        name: Notify custom jar
        image: curlimages/curl
        script:
          - |
            CUSTOMER_NAME="${CUSTOMER_NAME}"
            CUSTOM_RELEASE_REASON="${CUSTOM_RELEASE_REASON}"
            BRANCH_NAME="${BITBUCKET_BRANCH}"
            REPORTER="${YOUR_EMAIL_ID}"
            TIMESTAMP=$(date +%Y%m%d%H%M%S)  # Generate timestamp (e.g., 20230512123045)
            
            # Extract version info for JAR link construction
            commitID=$(echo "$BITBUCKET_COMMIT" | cut -c1-7)
            
            # Construct JAR URLs (both private and public repos)
            originalVersion=$(cat pom.xml | grep -m1 '<version>' | sed 's/.*<version>\(.*\)<\/version>.*/\1/')
            versionNumber=$(echo "$originalVersion" | cut -d"-" -f1)
            customVersionForTag="$versionNumber-$CUSTOMER_NAME-$commitID"
            customPublicVersionForTag="$versionNumber-$commitID-public"
            
            PRIVATE_JAR_URL="https://packages.atlassian.com/ui/repos/tree/General/maven-private-local/com/atlassian/jira/migration/jira-migration-plugin/$customVersionForTag/jira-migration-plugin-$customVersionForTag.jar"
            PUBLIC_JAR_URL="https://packages.atlassian.com/ui/repos/tree/General/maven-external/com/atlassian/jira/migration/jira-migration-plugin/$customPublicVersionForTag/jira-migration-plugin-$customPublicVersionForTag.jar"
            MAVEN_URL="https://maven.artifacts.atlassian.com/com/atlassian/jira/migration/jira-migration-plugin/$customPublicVersionForTag/"
            
            curl -X POST https://api-private.atlassian.com/automation/webhooks/jira/a/cb74e0ec-52d8-4c84-93c3-45501c34cd80/019985c9-a1a5-7745-a182-6556d14d4973 \
            -H "Content-Type: application/json" \
            -H "X-Automation-Webhook-Token: ${CUSTOM_JAR_AUTOMATION_TOKEN}" \
            -d @- <<EOF 
            {
              "customer": "${CUSTOMER_NAME}",
              "timestamp": "${TIMESTAMP}",
              "branch_name": "${BRANCH_NAME}",
              "release_reason": "${CUSTOM_RELEASE_REASON}",
              "reporter": "${REPORTER}",
              "jar_version": "${customVersionForTag}",
              "public_jar_version": "${customPublicVersionForTag}",
              "jar_links": {
                "private_jar_url": "${PRIVATE_JAR_URL}",
                "public_jar_url": "${PUBLIC_JAR_URL}",
                "maven_url": "${MAVEN_URL}"
              },
              "build_info": {
                "commit_id": "${commitID}",
                "full_commit": "${BITBUCKET_COMMIT}",
                "build_number": "${BITBUCKET_BUILD_NUMBER}",
                "repo_full_name": "${BITBUCKET_REPO_FULL_NAME}",
                "workflow_url" : "https://bitbucket.org/atlassian/jira-migration-plugin/pipelines/results/${BITBUCKET_BUILD_NUMBER}"
              },
            "socrates_link" : "https://socrates-workbench-01.cloud.databricks.com/dashboardsv3/01f08fb7636712caa3bbe4318693b45b/published?o=4246564776986330"
            }
            EOF
    - step: &kss-code-review-report
        name: "KSS Code Review"
        # Optional, but helps in debugging.
        artifacts:
          - code-insights-report.json
          - kss-report.log
        clone:
          strategy: clone
          depth: full
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - if [[ -f .git/objects/info/alternates ]]; then git repack -a -d && rm -rf .git/objects/info/alternates; fi
          - if ! [[ -f .git/refs/remotes/origin/$BITBUCKET_PR_DESTINATION_BRANCH ]]; then git fetch origin $BITBUCKET_PR_DESTINATION_BRANCH; fi
          - git branch -f $BITBUCKET_PR_DESTINATION_BRANCH origin/$BITBUCKET_PR_DESTINATION_BRANCH
          - git reset --hard origin/$BITBUCKET_BRANCH
          - pipe: docker://docker.atl-paas.net/atlassian/code-reports-kss:0.7.6-5282124
            variables:
              TARGET_BRANCH: $BITBUCKET_PR_DESTINATION_BRANCH
              # Maximum size of changed files to scan. Parsing large files can be slow or error out.
              SIZE_LIMIT_KB: "100"
          - pipe: docker://docker.atl-paas.net/atlassian/code-insights:1.4.8-5282124
            variables:
              KEY: kss

