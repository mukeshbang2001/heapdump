  custom:
    custom_release:
      - variables:
          - name: CUSTOMER_NAME
          - name: CUSTOM_RELEASE_REASON
          - name: YOUR_EMAIL_ID
          - name: BASE_VERSION
            default: ""
      - step:
          name: Input variable check
          script:
            - echo "Customer name = $CUSTOMER_NAME"
            - echo "Custom reason = $CUSTOM_RELEASE_REASON"
            - echo "Email id = $YOUR_EMAIL_ID"
            - |
              if [ -z "$CUSTOMER_NAME" ]; then
                echo "Error: The 'CUSTOMER_NAME' variable is mandatory. Please provide a value."
                exit 1
              fi
              
              if [ -z "$CUSTOM_RELEASE_REASON" ]; then
                echo "Error: The 'CUSTOM_RELEASE_REASON' variable is mandatory. Please provide a value."
                exit 1
              fi
              
              if [ -z "$YOUR_EMAIL_ID" ]; then
                echo "Error: The 'YOUR_EMAIL_ID' variable is mandatory. Please provide a value."
                exit 1
              fi

      - parallel:
          - step: *build-test
          - step: *default-integration-test
      - step: *perform-custom-release
      - step: *notify-jira-for-custom-jar
      - step: *publish-custom-release-to-maven

    deploy_to_instenv:
      - variables:
          - name: JIRA_BASE_URL
          - name: ADMIN_PASSWORD
      - step:
          <<: *stepDefaults
          name: Deploy To Instenv
          script:
            - pipe: atlassian/artifactory-sidekick:v1
            - source .artifactory/activate.sh
            - scripts/buildSnapshotVersionWithHash.sh
            - scripts/installBuildJarToJiraInstance.sh "$JIRA_BASE_URL" "$ADMIN_PASSWORD"
    deploy_to_instenv_staging:
      - variables:
          - name: JIRA_BASE_URL
          - name: ADMIN_PASSWORD
          - name: ADMIN_USERNAME
      - step:
          <<: *stepDefaults
          name: Deploy Staging Jar To Instenv
          script:
            - pipe: atlassian/artifactory-sidekick:v1
            - source .artifactory/activate.sh
            - git apply ./jcma-connect-to-staging-1_0.patch
            - scripts/buildSnapshotVersionWithHash.sh
            - scripts/installBuildJarToJiraInstance.sh "$JIRA_BASE_URL" "$ADMIN_PASSWORD" "$ADMIN_USERNAME"
    trigger-20k-perf-test-staging:
      - step:
          <<: *stepDefaults
          name: Trigger Staging 20K Performance Test
          size: 4x
          script:
            - *setup-deps
            - pipe: atlassian/artifactory-sidekick:v1
            - source .artifactory/activate.sh
            - scripts/performance-testing/checkout_release_branch.py scripts/buildSnapshotVersionWithHash.sh
            - scripts/performance-testing/triggerPerfTestForBuildJar.sh -e staging -d EXTRA_LARGE_BMW_20K_V1 -a "${TRIGGEREDBY}"
    trigger-yahoo-perf-test-staging:
      - step:
          <<: *stepDefaults
          name: Trigger Staging Yahoo Performance Test
          size: 4x
          script:
            - *setup-deps
            - pipe: atlassian/artifactory-sidekick:v1
            - source .artifactory/activate.sh
            - scripts/performance-testing/checkout_release_branch.py scripts/buildSnapshotVersionWithHash.sh
            - scripts/performance-testing/triggerPerfTestForBuildJar.sh -e staging -d LARGE_YAHOO -a "${TRIGGEREDBY}"
    trigger-20k-perf-test-prod:
      - step:
          <<: *stepDefaults
          name: Trigger Prod 20k Performance Test
          size: 4x
          script:
            - *setup-deps
            - pipe: atlassian/artifactory-sidekick:v1
            - source .artifactory/activate.sh
            - scripts/performance-testing/checkout_release_branch.py scripts/buildSnapshotVersionWithHash.sh
            - scripts/performance-testing/triggerPerfTestForBuildJar.sh -e prod -d EXTRA_LARGE_BMW_20K_V1 -a "${TRIGGEREDBY}"
    trigger-yahoo-perf-test-prod:
      - step:
          <<: *stepDefaults
          name: Trigger Prod Yahoo Performance Test
          size: 4x
          script:
            - *setup-deps
            - pipe: atlassian/artifactory-sidekick:v1
            - source .artifactory/activate.sh
            - scripts/performance-testing/checkout_release_branch.py scripts/buildSnapshotVersionWithHash.sh
            - scripts/performance-testing/triggerPerfTestForBuildJar.sh -e prod -d LARGE_YAHOO -a "${TRIGGEREDBY}"
    trigger-perf-test:
      - variables:
          - name: ENVIRONMENT
            default: staging
            allowed-values:
              - staging
              - prod
          - name: DATA_SET_SIZE
            default: LARGE_YAHOO
            allowed-values:
              - EXTRA_LARGE_BMW
              - EXTRA_LARGE_BMW_13K_PROJECTS
              - EXTRA_LARGE_BMW_20K_V1
              - EXTRA_LARGE_BMW_50K_V1
              - EXTRA_LARGE_SAP
              - EXTRA_LARGE_JSM_60K
              - LARGE_YAHOO
              - SMALL
              - DEBUG
          - name: MIGRATION_SCOPE_OPTION
            default: CONTAINERS_WITHOUT_ATTACHMENTS
            allowed-values:
              - ALL
              - CONTAINERS_WITHOUT_ATTACHMENTS
              - ATTACHMENTS_ONLY
              - USERS_AND_GROUPS_ONLY
              - APPS
            description: Migration scope option to use
          - name: USER_MIGRATION_MODE
            default: ALL
            allowed-values:
              - NONE
              - REFERENCED
              - ALL
            description: (Optional) User & JSD Customer migration mode to use
          - name: SHARD
            description: (Optional) Provide a valid shard prefix for the cloud site (e.g. "jira-perf-us-6")
          - name: DARK_FEATURE_FLAGS
            description: (Optional) Provide a comma delimited list of valid JCMA dark feature flags
          - name: BLOCK_BEFORE_RUNNING
            description: (Optional) Select "true" if you want to fully configure the Instenv + Cloudsite, but prevent the test migration itself from running
            default: NO
            allowed-values:
              - NO
              - YES
      - step:
          <<: *stepDefaults
          name: Trigger Performance Test
          size: 4x
          script:
            - *setup-deps
            - pipe: atlassian/artifactory-sidekick:v1
            - source .artifactory/activate.sh
            - scripts/buildSnapshotVersionWithHash.sh
            - |
              # Start with base command
              CMD="scripts/performance-testing/triggerPerfTestForBuildJar.sh -e \"$ENVIRONMENT\" -d \"$DATA_SET_SIZE\""

              # Add migration scope option parameter if it's set
              if [ -n "${MIGRATION_SCOPE_OPTION:-}" ]; then
                CMD="$CMD -m \"$MIGRATION_SCOPE_OPTION\""
              fi

              # Add user migration mode parameter if it's set
              if [ -n "${USER_MIGRATION_MODE:-}" ]; then
                CMD="$CMD -u \"$USER_MIGRATION_MODE\""
              fi

              # Add shard parameter if it's set
              if [ -n "${SHARD:-}" ]; then
                CMD="$CMD -s \"$SHARD\""
              fi

              # Add dark feature flags parameter if it's set
              if [ -n "${DARK_FEATURE_FLAGS:-}" ]; then
                CMD="$CMD --dark-features \"$DARK_FEATURE_FLAGS\""
              fi

              # Add author parameter if it's set
              if [ -n "${TRIGGEREDBY:-}" ]; then
                CMD="$CMD -a \"$TRIGGEREDBY\""
              fi

              # Add block on starting parameter if it's set to TRUE/YES
              if [[ "${BLOCK_BEFORE_RUNNING^^}" == "YES" ]] || [[ "${BLOCK_BEFORE_RUNNING^^}" == "TRUE" ]]; then
                CMD="$CMD --block-running YES"
              fi

              # Execute the command
              eval $CMD
    create-release-notes:
