    - step: &app-migration-end-to-end-test-non-blocking
        name: Run app migration E2E test
        script:
          - pipe: atlassian/trigger-pipeline:5.9.0
            variables:
              BITBUCKET_ACCESS_TOKEN: $E2E_TEST_PIPELINE_BITBUCKET_ACCESS_TOKEN
              REPOSITORY: "ams-e2e-test"
              CUSTOM_PIPELINE_NAME: "E2E-test-from-JCMA-custom-branch"
              PIPELINE_VARIABLES: >
                [{
                  "key": "JCMA_BRANCH_NAME",
                  "value": $BITBUCKET_BRANCH
                },
                {
                  "key": "PR_API_URL",
                  "value": https://api.bitbucket.org/2.0/repositories/$BITBUCKET_REPO_FULL_NAME/pullrequests/$BITBUCKET_PR_ID
                },
                {
                  "key": "INVOKING_CMA_BUILD_NUMBER",
                  "value": $BITBUCKET_BUILD_NUMBER
                }]
    - step: &download-stag-jar
        name: Create Staging Patched jar 🩹
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - git apply jcma-connect-to-staging-1_0.patch
          - export MAVEN_OPTS="-Xmx4096m -Xms4096m"
          - mvn clean package -P production -DskipTests=true -Dkotlin.test.compile.skip=true -Ddetekt.skip=true -Dbuildtime.output.log=true
        artifacts:
          - jira-migration-plugin/target/jira-migration-plugin-*SNAPSHOT.jar
          - jira-migration-plugin/target/jira-migration-plugin-*SNAPSHOT.obr
    - step: &download-prod-jar
        name: Create Prod jar 🏭
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - export MAVEN_OPTS="-Xmx4096m -Xms4096m"
          - mvn clean package -P production -DskipTests=true -Dkotlin.test.compile.skip=true -Ddetekt.skip=true -Dbuildtime.output.log=true
        artifacts:
          - jira-migration-plugin/target/jira-migration-plugin-*SNAPSHOT.jar
          - jira-migration-plugin/target/jira-migration-plugin-*SNAPSHOT.obr
    - step: &start-jar-creation
        name: Create Jars 📦
        trigger: manual
        script:
          - echo "Jar Creation Started"
    - step: &create-release-notes
        name: Create release notes in confluence
        size: 2x
        clone:
          depth: full
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - pipe: docker://docker.atl-paas.net/atlassian/migrations-release-page:latest
            variables:
              SPACE_KEY: $RELEASE_DOC_SPACE_KEY
              PARENT_PAGE_ID: $RELEASE_DOC_PARENT_PAGE_ID
              CONFLUENCE_EMAIL: $RELEASE_DOC_CONFLUENCE_EMAIL
              CONFLUENCE_API_KEY: $RELEASE_DOC_CONFLUENCE_API_KEY
              BITBUCKET_RELEASE_PAGE_REPO_TOKEN: $BITBUCKET_RELEASE_PAGE_REPO_TOKEN
              TEMPLATE_PAGE_ID: $RELEASE_DOC_TEMPLATE_PAGE_ID
              PR_BRANCHES: ["develop"]
              TABLE_ID: $RELEASE_DOC_CONFLUENCE_TABLE_ID
              PREVIOUS_RELEASE_BRANCH: $PREVIOUS_RELEASE_BRANCH
          - echo $(cat migrations-release-result.txt)
    - step: &invalidate-pipeline-target-cache
        name: Invalidate Pipeline's target cache
        script:
          - pipe: atlassian/bitbucket-clear-cache:3.5.0
            variables:
              BITBUCKET_ACCESS_TOKEN: $JCMA_CLEAR_CACHE_BITBUCKET_ACCESS_TOKEN
              CACHES: ["target"]
    ##
    ##Automating the release version update
    ##
    - step: &create-jcma-version-on-jac
        size: 2x
        name: Create JCMA version on JAC
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./jira-migration-plugin/bin/createJcmaVersionOnJac.sh $RELEASE_VERSION $RELEASE_DESCRIPTION $RELEASE_DATE_IN_YYYYMMDD
    - step: &create-jcma-version-on-gsac
        size: 2x
        name: Create JCMA version on GSAC
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./jira-migration-plugin/bin/createJcmaVersionOnGsac.sh $RELEASE_VERSION $RELEASE_DESCRIPTION $RELEASE_DATE_IN_YYYYMMDD
    - step: &yarn-install
        size: 2x
        name: Yarn Install and Push
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - ./scripts/bitbucketYarnInstall.sh
    - step: &cancel-previous-commit-pipelines
        size: 2x
        name: Cancel previous commit pipelines
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - node ./scripts/cancel-previous-pipelines.js
    - step: &create-release-branch
        name: Create Release Branch
        script:
          - echo "Creating release branch for $RELEASE_NAME"
          - git fetch --all
          - git checkout -b "release/$RELEASE_NAME" origin/develop
          - git push origin "release/$RELEASE_NAME"
    - step: &perform-blitz
        name: Blitz Setup
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - cd scripts && yarn install --immutable && cd ..
          - echo "Setting up Blitz Instenv"
          - node ./scripts/blitz/blitzSetUp.js jira-migration-plugin/target/jira-migration-plugin-*SNAPSHOT.obr
          - echo "Weekly Blitz Template - https://hello.atlassian.net/wiki/spaces/CT5/pages/4545031776/JCMA+P0+Blitz+Testing+-+Release+Version"
          - echo "Monthly Blitz Template - https://hello.atlassian.net/wiki/spaces/CT5/pages/2743649638/JCMA+Monthly+Release+Version+-+Consolidated+test+suite+and+Blitz+responsibilities+Template"
        artifacts:
          download: true
    - step: &test-regression-server
        size: 2x
        name: Run test on E2E server
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - cd scripts && yarn install --immutable && cd ..
          - node ./scripts/blitz/bitbucketRegressionServerTest.js jira-migration-plugin/target/jira-migration-plugin-*SNAPSHOT.obr
        artifacts:
          download: true
    - step: &clean-up-cloud
        size: 2x
        name: Cleaning up Cloud site
        script:
          - pipe: atlassian/artifactory-sidekick:v1
          - source .artifactory/activate.sh
          - cd scripts && yarn install --immutable && cd ..
          - node ./scripts/blitz/cleanUpCloud.js
        allow-failure: true
    - step: &private-release
        name: Private Release(Manual)
        trigger: manual
        script:
          - echo "Private release for $RELEASE_NAME"
          - echo "Update the jar from artifacts of step 'Create Release Version'"
          - echo "Upload the jar to marketplace following steps on https://hello.atlassian.net/wiki/spaces/CT5/pages/1153323354/Releasing+JCMA+and+CCMA+to+Marketplace"
    - step: &public-release
